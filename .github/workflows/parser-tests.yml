name: Parser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test existing JSON and text parsers
        run: python test_parser_errors.py

      - name: Test XML, CSV, Syslog, CEF, and LEEF parsers
        run: python test_parser_formats.py
